[package]
name = "soundovern-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
ctrlc = { version = "3.5.3", features = ["termination"] }
mdns-sd = "0.22.0"
pipewire = "0.10.1"
rtrb = "0.4.1"
socket2 = "0.6.5"
soundovern-core = { version = "0.1.0", path = "../soundovern-core" }
soundovern-proto = { version = "0.1.0", path = "../soundovern-proto" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
